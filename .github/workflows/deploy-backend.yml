name: Deploy backend (Hostinger KVM VPS)

# Only runs after ci.yml's test job has already passed on main (same repo,
# same commit) -- never deploys untested code. Does nothing until the six
# secrets below are added under Settings -> Secrets and variables ->
# Actions; until then this workflow exists but every run is a no-op skip.
on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]

jobs:
  deploy:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - name: Check required secrets are configured
        id: check
        run: |
          if [ -z "${{ secrets.VPS_HOST }}" ]; then
            echo "VPS_HOST (and friends) not set yet -- skipping deploy. See hostinger-deploy/VPS_DEPLOY.md." >&2
            echo "configured=false" >> "$GITHUB_OUTPUT"
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi

      - name: SSH deploy
        if: steps.check.outputs.configured == 'true'
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT }}
          script: |
            set -e
            cd ${{ secrets.VPS_DEPLOY_PATH }}
            git fetch origin main && git reset --hard origin/main
            ${{ secrets.VPS_VENV_DIR }}/bin/pip install -q -r hostinger-deploy/requirements.txt
            sudo systemctl restart cdpi-backend
