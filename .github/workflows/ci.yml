name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install test dependencies
        run: pip install -r requirements-test.txt

      - name: Syntax-check every Python file
        run: |
          python -m compileall -q . -x "(\.git|__pycache__|build|dist)"

      - name: Run test suite
        run: pytest tests/ -v --cov=. --cov-report=term-missing --cov-config=.coveragerc
