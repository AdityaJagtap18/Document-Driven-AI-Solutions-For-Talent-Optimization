name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install app + test dependencies
        # Real, pre-existing CI bug this fixes: only requirements-test.txt
        # (numpy/pytest/pytest-cov) was ever installed here, so every real
        # import this app's own code needs (azure.functions, azure.cosmos,
        # langchain, bcrypt, PyJWT, ...) was missing -- conftest.py's own
        # `import azure.functions as func` failed before a single test
        # could even collect, on every push since this workflow was added.
        run: pip install -r requirements.txt -r azure-functions/requirements.txt -r requirements-test.txt

      - name: Syntax-check every Python file
        run: |
          python -m compileall -q . -x "(\.git|__pycache__|build|dist)"

      - name: Run test suite
        # OPENAI_API_KEY: a fake placeholder, not a real key. generate_questions.py/
        # interview_bot.py/voicebot/voice_bot.py raise at IMPORT time if no LLM
        # provider (Ollama/OpenAI/Azure OpenAI) is configured at all -- this repo's
        # tests mock every real LLM call site (get_chat_llm/call_with_retry etc.),
        # never making a real OpenAI request, so a fake key is enough to satisfy
        # that import-time guard without needing a real secret in CI.
        env:
          OPENAI_API_KEY: sk-test-placeholder-not-a-real-key
        run: pytest tests/ -v --cov=. --cov-report=term-missing --cov-config=.coveragerc
